---
- name: Check if OCI CLI is already installed
  ansible.builtin.stat:
    path: /root/lib/oracle-cli/bin/oci
  register: oci_binary

- name: Install native Python and compiler prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: yes
  when: not oci_binary.stat.exists

- name: Create an isolated root virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /root/lib/oracle-cli
    creates: /root/lib/oracle-cli/bin/pip
  when: not oci_binary.stat.exists

- name: Upgrade pip inside the virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: /root/lib/oracle-cli
  when: not oci_binary.stat.exists

- name: Install the OCI CLI package directly via pip
  ansible.builtin.pip:
    name: oci-cli
    state: present
    virtualenv: /root/lib/oracle-cli
  when: not oci_binary.stat.exists

- name: Create hardcoded binary folder for root
  ansible.builtin.file:
    path: /root/bin
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: not oci_binary.stat.exists

- name: Symlink the working pip binary directly into root path
  ansible.builtin.file:
    src: /root/lib/oracle-cli/bin/oci
    dest: /root/bin/oci
    state: link
    owner: root
    group: root
  when: not oci_binary.stat.exists

- name: Lock down directory permissions so ONLY root can interact
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0700'
    recurse: yes
  loop:
    - /root/bin
    - /root/lib/oracle-cli
  when: not oci_binary.stat.exists

- name: Add bin folder to root profile
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: 'export PATH=$PATH:/root/bin'
    create: yes
    state: present
  when: not oci_binary.stat.exists
